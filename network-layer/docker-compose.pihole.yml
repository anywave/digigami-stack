# DIGIGAMI Guardian DNS + Pi-hole Integration
#
# This compose file runs Guardian DNS alongside Pi-hole for
# consent-aware blocking combined with ad blocking.
#
# Usage:
#   1. Copy config/.env.example to .env and configure
#   2. docker compose -f docker-compose.pihole.yml up -d
#   3. Point your router's DNS to this server's IP

version: '3.8'

services:
  # DIGIGAMI Guardian DNS - Consent Layer
  # Receives all DNS queries first, checks consent, then forwards to Pi-hole
  guardian-dns:
    build: .
    container_name: digigami-guardian
    hostname: guardian
    restart: unless-stopped
    ports:
      # Primary DNS - all devices point here
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      # DIGIGAMI Cloud connection
      - DIGIGAMI_CLOUD_URL=${DIGIGAMI_CLOUD_URL:-wss://api.digigami.ai/v1/spiral}
      - DIGIGAMI_API_KEY=${DIGIGAMI_API_KEY}

      # Forward allowed queries to Pi-hole
      - UPSTREAM_DNS=pihole
      - UPSTREAM_PORT=53

      # Block page configuration
      - BLOCK_PAGE_IP=${BLOCK_PAGE_IP:-192.168.1.100}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Profile ID for multi-profile households
      - PROFILE_ID=${PROFILE_ID:-default}
    networks:
      - dns_network
    depends_on:
      pihole:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(1); s.sendto(b'', ('127.0.0.1', 53))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pi-hole - Ad Blocking Layer
  # Receives forwarded queries from Guardian, blocks ads, forwards to upstream
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    # Pi-hole only exposed internally to Guardian DNS
    # No external ports - Guardian is the entry point
    expose:
      - "53/udp"
      - "53/tcp"
    ports:
      # Web interface for Pi-hole admin
      - "8080:80/tcp"
    environment:
      TZ: ${TZ:-America/New_York}
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      # Upstream DNS (after Pi-hole filtering)
      PIHOLE_DNS_: ${UPSTREAM_DNS:-1.1.1.1;1.0.0.1}
      # Performance tuning
      DNSMASQ_LISTENING: all
      # Privacy
      QUERY_LOGGING: 'true'
    volumes:
      - pihole_config:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    networks:
      - dns_network
    healthcheck:
      test: ["CMD", "dig", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_add:
      - NET_ADMIN

  # Block Page Server (optional)
  # Serves the DIGIGAMI block page with consent request flow
  block-page:
    image: nginx:alpine
    container_name: digigami-blockpage
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./blockpage:/usr/share/nginx/html:ro
    networks:
      - dns_network
    profiles:
      - with-blockpage

networks:
  dns_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pihole_config:
  pihole_dnsmasq:
