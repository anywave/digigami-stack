<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="45;47;45" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner core -->
  <circle cx="50" cy="50" r="35" fill="url(#coreGradient)" opacity="0.85"/>

  <!-- Center glow -->
  <circle cx="50" cy="50" r="20" fill="#818cf8" opacity="0.3">
    <animate attributeName="r" values="20;22;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
