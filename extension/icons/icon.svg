<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f19"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.6"/>

  <!-- Inner core -->
  <circle cx="64" cy="64" r="32" fill="url(#core)"/>

  <!-- Center glow -->
  <circle cx="64" cy="64" r="18" fill="#818cf8" opacity="0.4"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="8" fill="#ffffff"/>
</svg>
